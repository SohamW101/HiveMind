[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-env"
version = "0.1.0"
description = "A Multi-Agent PyBullet Warehouse Environment for Emergent-Communication RL"
authors = [
    { name = "HiveMind Team" }
]
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "numpy",
    "pybullet"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
include = ["hivemind_env*"]
