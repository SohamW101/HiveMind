[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-env"
version = "0.1.0"
description = "A Single-Agent PyBullet Environment for RL Foraging"
authors = [
    { name = "HiveMind Team" }
]
requires-python = ">=3.8"
dependencies = [
    "gymnasium",
    "numpy",
    "pybullet"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]
