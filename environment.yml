# Conda alternative. NOT the workflow in use -- see README.md "Setup": the project
# runs from a repo-root .venv on Python 3.14, invoked as .venv\Scripts\python.exe.
# This file is kept for Conda users and is not verified against the tested version
# table in the README (it pins Python 3.10 and omits torch / stable-baselines3).
name: hivemind
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pybullet
  - gymnasium
  - numpy
