<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="800" viewBox="0 0 2000 800"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="2000" height="800" fill="#fcfcfb"/><rect x="16" y="96" width="378" height="470" rx="22" fill="none" stroke="#d6d4cc" stroke-width="2" stroke-dasharray="8 8"/><text x="205.0" y="84" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#52514e" text-anchor="middle">Observation · 177-d per robot</text><rect x="420" y="96" width="903" height="470" rx="22" fill="none" stroke="#d6d4cc" stroke-width="2" stroke-dasharray="8 8"/><text x="871.5" y="84" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#52514e" text-anchor="middle">Feature extractor (PyTorch)  ·  ×2: separate copies for actor and critic</text><rect x="1355" y="96" width="638" height="470" rx="22" fill="none" stroke="#d6d4cc" stroke-width="2" stroke-dasharray="8 8"/><text x="1684.0" y="84" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#52514e" text-anchor="middle">Recurrent PPO (sb3-contrib)</text><rect x="30" y="150" width="350" height="110" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="205.0" y="187.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">World state · 57</text><text x="205.0" y="217.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">own pose/vel/carry 6 · teammates 12</text><text x="205.0" y="243.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">cartons 36 · depot &amp; time 3</text><rect x="30" y="290" width="350" height="110" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="205.0" y="340.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">LiDAR · 72</text><text x="205.0" y="370.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">270° sweep, 72 noisy ranges</text><rect x="30" y="430" width="350" height="110" rx="16" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/><text x="205.0" y="480.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">Messages · 48</text><text x="205.0" y="510.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">3 teammates × 16-token one-hot</text><rect x="440" y="150" width="380" height="110" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="630.0" y="200.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">MLP</text><text x="630.0" y="230.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">57 → 128 → 128, ReLU</text><rect x="794.0" y="188.0" width="52" height="34" rx="17" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="820" y="212.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#52514e" text-anchor="middle">128</text><rect x="440" y="290" width="380" height="110" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="630.0" y="327.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">1-D CNN</text><text x="630.0" y="357.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">conv k5 s2 → conv k3 s2, 32 ch</text><text x="630.0" y="383.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">18 positions × 32 ch = 576</text><rect x="794.0" y="328.0" width="52" height="34" rx="17" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="820" y="352.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#52514e" text-anchor="middle">576</text><rect x="440" y="430" width="380" height="110" rx="16" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/><text x="630.0" y="467.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">Multi-head self-attention</text><text x="630.0" y="497.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">embed 16→64 · 4 heads, 3 senders</text><text x="630.0" y="523.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">max-pool over senders → 64</text><rect x="800.0" y="468.0" width="40" height="34" rx="17" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="820" y="492.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#52514e" text-anchor="middle">64</text><line x1="380" y1="205.0" x2="434" y2="205.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ah)"/><line x1="380" y1="345.0" x2="434" y2="345.0" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ah)"/><line x1="380" y1="485.0" x2="434" y2="485.0" stroke="#eb6834" stroke-width="2.5" marker-end="url(#ah)"/><rect x="890" y="270.0" width="170" height="150" rx="16" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="975.0" y="327.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">Concat</text><text x="975.0" y="357.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">128 + 576 + 64</text><text x="975.0" y="383.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">= 768</text><path d="M854,205.0 H869.0 V296.0 H884" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ah)"/><path d="M854,345.0 H869.0 V345.0 H884" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ah)"/><path d="M854,485.0 H869.0 V394.0 H884" fill="none" stroke="#eb6834" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1115" y="270.0" width="170" height="150" rx="16" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="1200.0" y="327.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">Linear</text><text x="1200.0" y="357.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">768 → 256</text><text x="1200.0" y="383.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">ReLU</text><rect x="1259.0" y="328.0" width="52" height="34" rx="17" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/><text x="1285" y="352.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#52514e" text-anchor="middle">256</text><line x1="1060" y1="345.0" x2="1109" y2="345.0" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1375" y="175" width="150" height="130" rx="16" fill="#1c1c1b" stroke="#1c1c1b" stroke-width="2.5"/><text x="1450.0" y="235.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">LSTM</text><text x="1450.0" y="265.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#c3c2b7" text-anchor="middle">256 units</text><text x="1450.0" y="163" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill=