, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">→ 23 logits</text><rect x="1575" y="425" width="150" height="110" rx="16" fill="#ffffff" stroke="#d6d4cc" stroke-width="2.5"/><text x="1650.0" y="462.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">MLP</text><text x="1650.0" y="492.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">256→128→128</text><text x="1650.0" y="518.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">→ 1</text><line x1="1525" y1="240.0" x2="1569" y2="240.0" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><line x1="1525" y1="480.0" x2="1569" y2="480.0" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1775" y="145" width="200" height="82" rx="16" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="1875.0" y="181.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">π move</text><text x="1875.0" y="211.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">7-way categorical</text><rect x="1775" y="253" width="200" height="82" rx="16" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/><text x="1875.0" y="289.0" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="middle">π token</text><text x="1875.0" y="319.0" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="middle">16-way categorical</text><path d="M1725,240.0 H1747.0 V186 H1769" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1725,240.0 H1747.0 V294 H1769" fill="none" stroke="#eb6834" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1