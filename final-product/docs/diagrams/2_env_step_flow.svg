<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="760" viewBox="0 0 2000 760"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="2000" height="760" fill="#fcfcfb"/><rect x="40" y="110" width="340" height="150" rx="14" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/><text x="210.0" y="169.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Decode actions</text><text x="210.0" y="197.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">(move, token) per robot</text><text x="210.0" y="221.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">token → one-hot message</text><text x="62" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">1</text><rect x="430" y="110" width="340" height="150" rx="14" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="600.0" y="169.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Snap state</text><text x="600.0" y="197.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">grid-cell centre · cardinal yaw</text><text x="600.0" y="221.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">fixed chassis height</text><text x="452" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">2</text><path d="M382,185 L426,185" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="820" y="110" width="340" height="150" rx="14" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="990.0" y="169.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Validate</text><text x="990.0" y="197.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">shelf / wall / off-grid → refuse</text><text x="990.0" y="221.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">pick ≤1.5 cells · drop ≤1.5 of depot</text><text x="842" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">3</text><path d="M772,185 L816,185" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1210" y="110" width="340" height="150" rx="14" fill="#1c1c1b" stroke="#1c1c1b" stroke-width="2.5"/><text x="1380.0" y="169.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Physics</text><text x="1380.0" y="197.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="middle">N interpolated sub-steps</text><text x="1380.0" y="221.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="middle">arm, gripper, carried carton</text><text x="1232" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">4</text><path d="M1162,185 L1206,185" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1600" y="110" width="340" height="150" rx="14" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="1770.0" y="169.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Contacts</text><text x="1770.0" y="197.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">new robot–robot and</text><text x="1770.0" y="221.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">robot–obstacle events</text><text x="1622" y="140" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">5</text><path d="M1552,185 L1596,185" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1770.0,260 L1770.0,320 L1580,320 L1580,395" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1405" y="400" width="340" height="150" rx="14" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="1575.0" y="459.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Termination</text><text x="1575.0" y="487.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">all cartons delivered →</text><text x="1575.0" y="511.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">terminated; cap → truncated</text><text x="1427" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">6</text><rect x="1015" y="400" width="340" height="150" rx="14" fill="#eaf6ea" stroke="#0ca30c" stroke-width="2.5"/><text x="1185.0" y="459.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Reward</text><text x="1185.0" y="487.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">0.8·shared + 0.2·individual</text><text x="1185.0" y="511.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">+ 30·(Φ(s′) − Φ(s))</text><text x="1037" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">7</text><path d="M1403,475 L1359,475" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="625" y="400" width="340" height="150" rx="14" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="795.0" y="459.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Observation</text><text x="795.0" y="487.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">177-d per robot: state, cartons,</text><text x="795.0" y="511.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">72-ray LiDAR, teammates' tokens</text><text x="647" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">8</text><path d="M1013,475 L969,475" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="235" y="400" width="340" height="150" rx="14" fill="#ffffff" stroke="#d6d4cc" stroke-width="2.5"/><text x="405.0" y="459.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Return</text><text x="405.0" y="487.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">obs (4×177), rewards (4),</text><text x="405.0" y="511.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">terminated, truncated, info</text><text x="257" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#898781" text-anchor="start">9</text><path d="M623,475 L579,475" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><text x="40" y="70" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="start">HiveMindMultiAgentEnv.step(actions): one decision step for all 4 robots, executed simultaneously</text><text x="40" y="640" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52514e" text-anchor="start">Robots may enter each other's cells (charged as a collision, not prevented); invalid actions cost −0.5 and leave the robot in place.</text><text x="40" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52514e" text-anchor="start">Messages written in step t appear in teammates' observations returned by step t, i.e. they inform actions at t + 1.</text></svg>