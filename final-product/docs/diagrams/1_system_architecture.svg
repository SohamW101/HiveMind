<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect width="2000" height="900" fill="#fcfcfb"/><rect x="30" y="60" width="640" height="600" rx="20" fill="none" stroke="#d6d4cc" stroke-width="2" stroke-dasharray="8 8"/><text x="46" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Simulation (CPU, 8 worker processes)</text><rect x="60" y="100" width="580" height="120" rx="14" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="350.0" y="156.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">VecMonitor → VecNormalize</text><text x="350.0" y="184.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">episode statistics · reward normalisation</text><rect x="60" y="270" width="580" height="130" rx="14" fill="#f3f2ee" stroke="#d6d4cc" stroke-width="2.5"/><text x="350.0" y="319.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">HiveMindSubprocVecEnv</text><text x="350.0" y="347.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">1 OS process per world · world → 4 agent slots</text><text x="350.0" y="371.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">8 worlds = 32 slots, auto-reset per world</text><rect x="60" y="450" width="580" height="180" rx="14" fill="#eef4fc" stroke="#2a78d6" stroke-width="2.5"/><text x="350.0" y="512.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">HiveMindMultiAgentEnv  ×8</text><text x="350.0" y="540.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">PyBullet world · 13×13 warehouse · 4 robots</text><text x="350.0" y="564.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">random shelf gaps · 12 cartons · depot</text><text x="350.0" y="588.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">LiDAR · rewards · message channel</text><path d="M330,445 L330,405" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M330,265 L330,225" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M370,225 L370,265" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M370,405 L370,445" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="740" y="60" width="620" height="600" rx="20" fill="none" stroke="#d6d4cc" stroke-width="2" stroke-dasharray="8 8"/><text x="756" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Learning (PyTorch, Stable-Baselines3 / sb3-contrib)</text><rect x="770" y="100" width="560" height="170" rx="14" fill="#1c1c1b" stroke="#1c1c1b" stroke-width="2.5"/><text x="1050.0" y="157.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">RecurrentPPO</text><text x="1050.0" y="185.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="middle">shared policy for all 4 robots</text><text x="1050.0" y="209.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="middle">HiveMindExtractor → LSTM → π (move, token) / V</text><text x="1050.0" y="233.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#c3c2b7" text-anchor="middle">rollout 512 × 32 · batch 4096 · 10 epochs</text><rect x="770" y="320" width="560" height="150" rx="14" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/><text x="1050.0" y="379.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Callbacks</text><text x="1050.0" y="407.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">CurriculumCallback: 1→2→4→8→12 cartons at 85% success</text><text x="1050.0" y="431.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">MetricsCallback · CheckpointCallback</text><rect x="770" y="520" width="560" height="110" rx="14" fill="#ffffff" stroke="#d6d4cc" stroke-width="2.5"/><text x="1050.0" y="571.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">scripts/train.py</text><text x="1050.0" y="599.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">CLI · builds env + model · --communication --curriculum</text><path d="M640,140 L765,140" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M770,190 L645,190" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1050,320 L1050,275" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1050,515 L1050,475" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1430" y="60" width="540" height="600" rx="20" fill="none" stroke="#d6d4cc" stroke-width="2" stroke-dasharray="8 8"/><text x="1446" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Outputs and evaluation</text><rect x="1460" y="100" width="480" height="110" rx="14" fill="#eaf6ea" stroke="#0ca30c" stroke-width="2.5"/><text x="1700.0" y="151.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">models/*.zip</text><text x="1700.0" y="179.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">periodic checkpoints + final weights</text><rect x="1460" y="250" width="480" height="120" rx="14" fill="#ffffff" stroke="#d6d4cc" stroke-width="2.5"/><text x="1700.0" y="294.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Evaluation scripts</text><text x="1700.0" y="322.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">evaluate_ablation · inference · record_demo</text><text x="1700.0" y="346.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">→ JSON lines, MP4 videos</text><rect x="1460" y="410" width="480" height="90" rx="14" fill="#ffffff" stroke="#d6d4cc" stroke-width="2.5"/><text x="1700.0" y="451.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">make_presentation_graphs</text><text x="1700.0" y="479.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">training + evaluation + message analysis</text><rect x="1460" y="540" width="480" height="90" rx="14" fill="#eaf6ea" stroke="#0ca30c" stroke-width="2.5"/><text x="1700.0" y="581.0" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">tensorboard_logs/</text><text x="1700.0" y="609.0" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">rollout · train · curriculum · metrics</text><path d="M1330,155 L1455,155" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1330,420 L1395,420 L1395,585 L1455,585" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1700,210 L1700,245" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1700,370 L1700,405" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1880,540 L1880,505" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#ah)"/><text x="1000" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">Loop: PPO sends 32 actions (move, token) → 8 workers step physics in parallel → 32 observations (177-d) + rewards return.</text><text x="1000" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52514e" text-anchor="middle">Every 16,384 transitions: 10 epochs of minibatch updates. The curriculum callback sets every world's carton count and step cap.</text></svg>